plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.baselineprofile'
}

def apiOrigin = project.findProperty('apiOrigin') ?: 'https://api.deepseek.com'
// Single source of truth for the app version: edit gradle.properties only.
def echoVersionCode = (project.findProperty('echo.versionCode') ?: '1').toInteger()
def echoVersionName = project.findProperty('echo.versionName') ?: '1.0.0'
// Plain HTTP is only allowed when a debug build explicitly points at a local mock
// server (apiOrigin=http://...). Shipped builds stay TLS-only.
def usesCleartext = apiOrigin.startsWith('http:') ? 'true' : 'false'

android {
    namespace 'app.echo'
    compileSdk 35

    defaultConfig {
        // Public identity of Echo. app.xuxie is retired and must not be reused.
        applicationId 'app.echo'
        minSdk 26
        targetSdk 35
        versionCode echoVersionCode
        versionName echoVersionName
        buildConfigField 'String', 'API_ORIGIN', "\"" + apiOrigin + "\""
        manifestPlaceholders = [usesCleartext: usesCleartext]
    }

    // Release signing is configured from GRADLE_USER_HOME (outside the repo).
    // Contributors without those keys fall back to the debug key below.
    def relStore = project.findProperty('echo.release.storeFile')
    signingConfigs {
        if (relStore) {
            release {
                storeFile file(relStore)
                storePassword project.findProperty('echo.release.storePassword')
                keyAlias project.findProperty('echo.release.keyAlias') ?: 'echo'
                keyPassword project.findProperty('echo.release.keyPassword')
            }
        }
    }

    buildFeatures { compose true; buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            // Aggressive code + resource shrinking; full mode lets R8 remove more
            // unreachable Compose/material3 entry points than compat mode.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Real release key when available; debug key otherwise (local dev only).
            signingConfig relStore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            // No minify: keeps token names so the perf work stays debuggable.
        }
    }

}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    // 1.4.x raises the write support ceiling: 1.3.1 stopped at API 34 and
    // silently refused baseline-profile writes on Android 15 (API 35).
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    // Profile is generated on-device by the official AndroidX baselineprofile
    // plugin (the :baselineprofile macrobenchmark module), not hand-written.
    baselineProfile project(':baselineprofile')

    // JVM-only unit tests: plain JUnit4, coroutines test helpers and real org.json.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.json:json:20240303'
}