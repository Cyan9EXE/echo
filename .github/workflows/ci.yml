name: CI

# 路线图 10：JVM 单测 + Kotlin 编译 + mock SSE 冒烟。
# 仓库没有 gradle-wrapper.jar，因此显式安装 Gradle 8.9。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JVM tests (JDK 17 / Gradle 8.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK (platform 35 + build-tools 35.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --console=plain --no-daemon

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --console=plain --no-daemon

      - name: Mock SSE server selftest
        run: python3 scripts/mock_sse_server.py --selftest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 7
